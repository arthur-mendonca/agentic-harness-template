[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-verifiable-harness"
version = "0.3.0"
description = "Shared verification runner, conservative project installer and versioned Agent Skills"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
harness = "harness.runner:main"
harness-setup = "harness.installer:main"

[tool.setuptools]
packages = ["harness"]
